name: CI/CD - Python Package

on:
  push:
    paths:
      - "**.py"
      - "**.toml"
      - "**.yml"
      - "**.xml"
      - "README.md"
      - "scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - "**.py"
      - "**.toml"
      - "**.yml"
      - "**.xml"
      - "README.md"
      - "scripts/**"
      - "tests/**"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

env:
  FULL_CI_MATRIX: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) }}

jobs:
  python-quality:
    name: Python HPM Unit, Lint & Type Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: "pip"

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest black==24.8.0 flake8==7.1.1 mypy==1.11.2 types-PyYAML types-requests

      - name: Run HPM unit and golden tests
        run: python -m pytest -q

      - name: Check HPM formatting
        run: |
          python -m black --check --target-version py38 \
            src/libxr/platforms/hpm \
            src/libxr/ConfigHPMProject.py \
            src/libxr/GeneratorCodeHPM.py \
            src/libxr/PeripheralAnalyzerHPM.py \
            scripts/hpm_cli_smoke.py \
            tests/test_hpm*.py

      - name: Lint HPM backend
        run: |
          python -m flake8 \
            src/libxr/platforms/hpm \
            src/libxr/ConfigHPMProject.py \
            src/libxr/GeneratorCodeHPM.py \
            src/libxr/PeripheralAnalyzerHPM.py \
            scripts/hpm_cli_smoke.py \
            tests \
            --filename='test_hpm*.py' \
            --max-line-length=99 \
            --extend-ignore=E203,W503

      - name: Type-check HPM backend
        run: python -m mypy src/libxr/platforms/hpm

  discover-stm32-targets:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - name: Checkout STM32 Test Projects
        uses: actions/checkout@v4
        with:
          repository: Jiu-xiao/libxr_stm32_test
          path: test-project

      - name: Discover STM32 targets
        id: targets
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          root = Path("test-project")
          targets = sorted(
              path.name
              for path in root.iterdir()
              if path.is_dir() and not path.name.startswith(".")
          )
          if not targets:
              raise SystemExit("No STM32 target directories found")

          if os.environ.get("FULL_CI_MATRIX") != "true":
              targets = targets[:2]

          print("matrix=" + json.dumps({"target": targets}, separators=(",", ":")))
          PY

  discover-hpm-targets:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - name: Checkout HPM Test Projects
        uses: actions/checkout@v4
        with:
          repository: xrobot-org/libxr_hpm_test
          path: test-project

      - name: Discover HPM targets
        id: targets
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          root = Path("test-project")
          targets = sorted(
              path.name
              for path in root.iterdir()
              if path.is_dir() and (path / "hpm_peripherals.yaml").is_file()
          )
          if not targets:
              raise SystemExit("No top-level HPM targets found")

          if os.environ.get("FULL_CI_MATRIX") != "true":
              targets = targets[:2]

          print("matrix=" + json.dumps({"target": targets}, separators=(",", ":")))
          PY

  configure-build-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Configure Python build matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          if os.environ.get("FULL_CI_MATRIX") == "true":
              matrix = {
                  "os": ["ubuntu-latest", "windows-latest"],
                  "arch": ["x86_64", "arm64"],
                  "python-version": ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"],
                  "exclude": [{"os": "windows-latest", "arch": "arm64"}],
              }
          else:
              matrix = {
                  "include": [
                      {
                          "os": "ubuntu-latest",
                          "arch": "x86_64",
                          "python-version": "3.8",
                      },
                      {
                          "os": "ubuntu-latest",
                          "arch": "arm64",
                          "python-version": "3.13",
                      },
                      {
                          "os": "windows-latest",
                          "arch": "x86_64",
                          "python-version": "3.13",
                      },
                  ]
              }

          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          PY

  stm32-target-test:
    name: STM32 Target (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: discover-stm32-targets
    container:
      image: ghcr.io/xrobot-org/docker-image-stm32:main
      options: --user 0

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-stm32-targets.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Python Package
      run: |
        python ./scripts/gen_libxr_version.py
        pip install .

    - name: Compiler Version Check
      run: |
        arm-none-eabi-gcc --version
        starm-clang --version

    - name: Get Test Projects
      uses: actions/checkout@v4
      with:
        repository: Jiu-xiao/libxr_stm32_test
        path: test-project

    - name: Run STM32 target test
      run: |
        cd test-project && ./test.sh master "${{ matrix.target }}"

  hpm-target-test:
    name: HPM Target (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: discover-hpm-targets
    env:
      HPM_SDK_BASE: ${{ github.workspace }}/hpm-sdk
      GNURISCV_TOOLCHAIN_PATH: /opt/hpm-riscv32-unknown-elf
    container:
      image: ghcr.io/xrobot-org/docker-image-hpm:main
      options: --user 0

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-hpm-targets.outputs.matrix) }}

    steps:
      - name: Checkout Current Generator
        uses: actions/checkout@v4

      - name: Install Current Generator
        run: |
          python ./scripts/gen_libxr_version.py
          python -m pip install .

      - name: Checkout HPM SDK 1.11.0
        uses: actions/checkout@v4
        with:
          repository: hpmicro/hpm_sdk
          ref: v1.11.0
          path: hpm-sdk

      - name: Checkout HPM Test Projects
        uses: actions/checkout@v4
        with:
          repository: xrobot-org/libxr_hpm_test
          path: test-project
          submodules: recursive

      - name: Run HPM target test
        working-directory: test-project
        run: ./test.sh "${{ matrix.target }}"

  build:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: configure-build-matrix

    strategy:
      matrix: ${{ fromJSON(needs.configure-build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8 black build twine

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pytest flake8 black build twine

      - name: Build Package
        run: |
          python ./scripts/gen_libxr_version.py
          python -m build

      - name: Check Package Metadata
        run: |
          twine check dist/*

      - name: Rename built package files (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          for file in dist/*.whl dist/*.tar.gz; do
            if [[ -f "$file" ]]; then
              new_name=$(echo "$file" | sed -E "s/^dist\/libxr-([0-9]+\.[0-9]+\.[0-9]+)-py([0-9]+)-none-any\.(whl|tar.gz)$/dist\/libxr-\1-py\2-none-any.\3/")
              if [[ "$file" != "$new_name" ]]; then
                mv "$file" "$new_name"
              fi
            fi
          done
          ls -lh dist/

      - name: Rename built package files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/* -Include *.whl, *.tar.gz | ForEach-Object {
            $newName = $_.Name -replace '^libxr-([0-9]+\.[0-9]+\.[0-9]+)-py([0-9]+)-none-any\.(whl|tar.gz)', 'libxr-$1-py$2-none-any.$3'
            if ($_.Name -ne $newName) {
              Rename-Item -Path $_.FullName -NewName $newName
            }
          }
          Get-ChildItem -Path dist/

      - name: Upload Built Package
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ matrix.os }}-${{ matrix.arch }}-py${{ matrix.python-version }}
          path: dist/*

      - name: Install built package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pip install dist/*.whl || pip install dist/*.tar.gz

      - name: Install built package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist\*.whl,dist\*.tar.gz | Select-Object -First 1
          if ($pkg) {
            pip install $pkg.FullName
          }

      - name: Smoke-check installed HPM CLI
        run: python ./scripts/hpm_cli_smoke.py --expected-version 5.3.0

      - name: Import smoke check (all top-level modules)
        run: |
          python ./scripts/ci_import_smoke.py

      - name: CubeMX runner smoke check
        run: |
          python ./scripts/cubemx_runner_smoke.py

      - name: LibXR submodule policy smoke check
        run: |
          python ./scripts/libxr_submodule_smoke.py

      - name: Checkout BSP Compatibility Test Repo
        uses: actions/checkout@v4
        with:
          repository: xrobot-org/bsp_stm32f103c8
          path: bsp_test

      - name: Python Compatibility Check (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd bsp_test
          xr_cubemx_cfg -d .

      - name: Python Compatibility Check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location bsp_test
          xr_cubemx_cfg -d .

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - python-quality
      - build
      - hpm-target-test
      - stm32-target-test
    if: github.event_name == 'release'

    permissions:
      id-token: write

    environment:
      name: XRobot
      url: https://pypi.org/project/libxr

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Move built packages to root dist/
        run: |
          find dist/ -mindepth 2 -type f -exec mv {} dist/ \;
          rm -rf dist/python-package-*  # 清理空文件夹
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          user: XRobot
          password: ${{ secrets.TOKEN }}
